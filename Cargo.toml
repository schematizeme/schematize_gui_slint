[package]
name = "schematize-gui-slint"
version = "0.1.0"
edition = "2021"
description = "schematize em Slint (migração incremental) — aba Skills como GESTOR funcional (dados/ações reais via o crate `schematize`). A GUI egui segue shippando até o Slint chegar a paridade."
license = "MIT"
publish = false

[[bin]]
name = "schematize-gui"
path = "src/main.rs"

[dependencies]
# GUI toolkit. Backend padrão em desktop Linux = winit (cobre Wayland E X11);
# renderer padrão = femtovg (OpenGL/GLES). NÃO ativamos renderer-skia porque
# skia exige cmake (ausente neste host). fontconfig é carregada por dlopen em
# runtime, então o build NÃO precisa de pkg-config nem headers de fontconfig.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
] }
# Backend winit DIRETO (mesma versão do slint) só pra SETAR o app_id/WM_CLASS da janela =
# "schematize-gui" via `with_window_attributes_hook` — no Wayland (KDE/GNOME) o compositor casa a
# janela ao schematize-gui.desktop por app_id pra achar o ícone; sem isso o dock mostra um "W".
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-femtovg"] }
# Reusa a LÓGICA do crate irmão (catálogo + install/remove/versões + i18n) SEM
# a GUI egui: default-features=false NÃO ativa a feature `gui` (eframe/rfd ficam
# de fora). Nada de reimplementar registry/skills/i18n aqui.
schematize = { git = "https://github.com/schematizeme/schematize-cli", branch = "main", default-features = false }
# Seletor de pasta NATIVO do sistema (aba Overdev: "Abrir pasta…" / dev_dirs).
# Mesmo backend do egui: xdg-portal + wayland (funciona em Wayland/X11 via portal,
# SEM puxar GTK). `pick_folder()` é bloqueante — chamado no event loop (rápido).
rfd = { version = "0.17", default-features = false, features = [
    "xdg-portal",
    "wayland",
] }
# Só pra converter o epoch das conclusões do overdev pra HORA LOCAL (HH:MM:SS) no
# log da aba Overdev. JÁ está no grafo de deps (transitivo via i-slint-core, com a
# feature `clock` ligada) — declarar direto NÃO puxa crate novo, só libera
# `chrono::Local` aqui. Sem isso teríamos de mostrar UTC (offset local não sai do std).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Serialização do Schema do Database builder (carregar/salvar schema.json). O
# `database::Schema` do lib deriva serde; aqui só precisamos do formato JSON. Já
# está no grafo de deps (transitivo via `schematize`) — declarar não puxa crate novo.
serde_json = "1"

[build-dependencies]
slint-build = "1.17"

[profile.release]
strip = true
opt-level = "z"
lto = true
