[package]
name = "schematize-gui-slint"
version = "0.1.0"
edition = "2021"
description = "schematize em Slint (migração incremental) — aba Skills como GESTOR funcional (dados/ações reais via o crate `schematize`). A GUI egui segue shippando até o Slint chegar a paridade."
license = "MIT"
publish = false

[[bin]]
name = "schematize-gui-slint"
path = "src/main.rs"

[dependencies]
# GUI toolkit. Backend padrão em desktop Linux = winit (cobre Wayland E X11);
# renderer padrão = femtovg (OpenGL/GLES). NÃO ativamos renderer-skia porque
# skia exige cmake (ausente neste host). fontconfig é carregada por dlopen em
# runtime, então o build NÃO precisa de pkg-config nem headers de fontconfig.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
] }
# Reusa a LÓGICA do crate irmão (catálogo + install/remove/versões + i18n) SEM
# a GUI egui: default-features=false NÃO ativa a feature `gui` (eframe/rfd ficam
# de fora). Nada de reimplementar registry/skills/i18n aqui.
schematize = { path = "../schematize_cli_rs", default-features = false }

[build-dependencies]
slint-build = "1.17"

[profile.release]
strip = true
opt-level = "z"
lto = true
